[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["views/**", "public/**", "firebase-applet-config.json"]

# Serve static assets directly from CDN
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"
  status = 200

# Forward all application and admin routes to the Netlify serverless handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
