<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8bc85"/>
      <stop offset="50%" stop-color="#c5a56a"/>
      <stop offset="100%" stop-color="#9a7a40"/>
    </linearGradient>
    <linearGradient id="compassDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102b2d"/>
      <stop offset="100%" stop-color="#071b1c"/>
    </linearGradient>
  </defs>

  <!-- Compass Star Icon -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#102b2d" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="22" fill="none" stroke="#c5a56a" stroke-width="1.2" stroke-dasharray="2,3"/>
    
    <!-- Compass North Needle -->
    <polygon points="30,8 35,30 30,26" fill="#102b2d"/>
    <polygon points="30,8 25,30 30,26" fill="#c5a56a"/>
    
    <!-- Compass South Needle -->
    <polygon points="30,52 35,30 30,34" fill="#c5a56a"/>
    <polygon points="30,52 25,30 30,34" fill="#102b2d"/>
    
    <!-- Compass East/West Needles -->
    <polygon points="52,30 30,25 34,30" fill="#102b2d"/>
    <polygon points="52,30 30,35 34,30" fill="#c5a56a"/>
    <polygon points="8,30 30,25 26,30" fill="#c5a56a"/>
    <polygon points="8,30 30,35 26,30" fill="#102b2d"/>

    <circle cx="30" cy="30" r="3" fill="#102b2d"/>
  </g>

  <!-- Typography -->
  <text x="82" y="42" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" fill="#102b2d" letter-spacing="1">COMPASS <tspan fill="#c5a56a">LEGAL</tspan></text>
  <text x="84" y="60" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#5a7072" letter-spacing="0.5">Your Legal Journey, Guided with Care and Clarity</text>
</svg>
